<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Yeni Şifrə Təyin Et - Nexus</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .auth-card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 420px;
            text-align: center;
            border: 1px solid #334155;
        }
        .auth-card h2 {
            margin-bottom: 25px;
            color: #f1f5f9;
            font-size: 26px;
        }
        .input-group {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            background: #0f172a;
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #475569;
        }
        .input-group input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            width: 100%;
            margin-left: 10px;
            font-size: 15px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: background 0.3s ease;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
        }
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: left;
        }
        .alert-danger {
            background-color: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #f87171;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Yeni Şifrə Təyin Et</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="input-group">
                <span>🔒</span>
                <input type="password" name="password" placeholder="Yeni şifrənizi daxil edin" required>
            </div>
            
            <button type="submit" class="btn-login">Şifrəni yenilə →</button>
        </form>
    </div>
</body>
</html>
