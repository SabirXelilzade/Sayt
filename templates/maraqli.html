{% extends 'base.html' %}

{% block title %}nexus - Ayarlar{% endblock %}

{% block content %}
        <!-- Mərkəzi Hissə - Maraqlı Bölməsi -->
        <main class="feed-content">
            <div class="search-bar-container">
                <input type="text" placeholder="İnsan, post, qrup axtar...">
            </div>
            <div style="background-color: #111b21; padding: 20px; border-radius: 12px; border: 1px solid #222d34; color: #8696a0;">
                <h2 style="color: white; margin-bottom: 10px;">Maraqlı Paylaşımlar</h2>
                <p>Burada ən populyar və maraqlı postlar göstəriləcək.</p>
            </div>
        </main>

        <!-- Sağ Panel -->
        <aside class="sidebar-right">
            <div class="online-users-header">
                <h3>Trendlər</h3>
            </div>
            <ul class="online-list">
                <li class="empty-msg">Hələ ki trend mövzu yoxdur</li>
            </ul>
        </aside>
    </div>
{% endblock %}
