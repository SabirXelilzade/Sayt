<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Admin Paneli - Qeydiyyatdan Keçənlər</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        a { display: inline-block; margin-bottom: 20px; text-decoration: none; background: #333; color: white; padding: 10px 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <a href="{{ url_for('index') }}">← Ana səhifəyə qayıt</a>
    <h1>Qeydiyyatdan Keçən İstifadəçilər</h1>
    <table>
        <tr>
            <th>ID</th>
            <th>İstifadəçi Adı</th>
            <th>E-poçt</th>
            <th>Bio</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.bio }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
