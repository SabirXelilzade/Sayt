<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Qeydiyyat - nexus.com</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: #161b22; padding: 30px; border-radius: 10px; width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #30363d; }
        h2 { text-align: center; color: #00d26a; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #00d26a; border: none; color: #fff; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #00b058; }
        a { color: #58a6ff; text-decoration: none; display: block; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>nexus.com - Qeydiyyat</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="İstifadəçi adı" required>
            <input type="email" name="email" placeholder="E-poçt ünvanı" required>
            <input type="password" name="password" placeholder="Şifrə" required>
            <button type="submit">Qeydiyyatdan keç</button>
        </form>
        <a href="{{ url_for('login') }}">Artıq hesabınız var? Daxil olun</a>
    </div>
</body>
</html>
