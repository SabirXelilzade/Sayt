<!DOCTYPE html>
<html lang="az" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qeydiyyat - nexus.com</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .btn-custom {
            background-color: #00d26a;
            border-color: #00d26a;
            color: #fff;
        }
        .btn-custom:hover {
            background-color: #00b058;
            border-color: #00b058;
            color: #fff;
        }
    </style>
</head>
<body class="bg-body-tertiary d-flex justify-content-center align-items-center min-vh-100 m-0" style="background-color: #0d1117 !important;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-4">
                <div class="card shadow-lg p-3 rounded-4 border-secondary" style="background-color: #161b22;">
                    <div class="card-body">
                        <h2 class="text-center mb-4 fw-bold" style="color: #00d26a;">nexus.com</h2>
                        <h5 class="text-center text-muted mb-4 fs-6">Qeydiyyat səhifəsi</h5>
                        
                        <!-- Flash xəbərləri -->
                        {% with messages = get_flashed_messages() %}
                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert alert-danger py-2 text-center fs-6" role="alert">
                                        {{ message }}
                                    </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form method="POST">
                            <div class="mb-3">
                                <input type="text" name="username" class="form-control bg-dark text-light border-secondary py-2" placeholder="İstifadəçi adı" required>
                            </div>
                            <div class="mb-3">
                                <input type="email" name="email" class="form-control bg-dark text-light border-secondary py-2" placeholder="E-poçt ünvanı (@gmail.com)" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" name="password" class="form-control bg-dark text-light border-secondary py-2" placeholder="Şifrə" required>
                            </div>
                            <button type="submit" class="btn btn-custom w-100 py-2 fw-semibold">Qeydiyyatdan keç</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
