<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nexus Butulka Oyunu</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Arial,sans-serif;background:#111;color:#333;display:flex;overflow:hidden;user-select:none}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hidden{display:none!important}
.game-area{flex:1;min-width:0;position:relative;container-type:size;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(circle at center,#d98f45 0%,#b86e28 65%,#8c4c15 100%);box-shadow:inset 0 0 80px rgba(0,0,0,.4)}
.game-area::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0 2px,transparent 2px 10px);pointer-events:none}
.topbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:8px;padding:0 8px;z-index:30}
.pill{height:36px;min-width:36px;padding:0 10px;border-radius:18px;border:2px solid rgba(255,255,255,.7);background:rgba(230,130,45,.9);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 3px 6px rgba(0,0,0,.3)}
.pill.heart{background:linear-gradient(135deg,#ff5252,#ff1744)}
#status{flex:1;text-align:center;color:#fff;font-weight:700;font-size:15px;line-height:1.2;text-shadow:0 2px 5px rgba(0,0,0,.95)}
.stage{position:relative;width:min(100cqw,calc(100cqh - 46px));aspect-ratio:1;container-type:size}
.rosette{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#ebb059 0%,#d88b28 65%,#b86a15 100%);border:.8cqw solid #a65c13;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#bottle{position:absolute;left:50%;top:50%;width:18%;transform:translate(-50%,-50%);background:none;border:0;z-index:10;will-change:transform}
#bottle svg{display:block;width:100%;height:auto}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;background:none;border:0;z-index:15}
.av{position:relative;width:13cqw;height:13cqw;border-radius:2cqw;border:.5cqw solid rgba(255,255,255,.9);background:#4a6572;display:flex;align-items:center;justify-content:center;font-size:7.5cqw;box-shadow:0 8px 16px rgba(0,0,0,.4)}
.seat.turn .av{box-shadow:0 0 0 .8cqw #ffd54f,0 0 3cqw #ffd54f}
.seat.sel .av{outline:.6cqw dashed #fff;outline-offset:.4cqw}
.nm{margin-top:3px;font-size:clamp(11px,2.4cqw,14px);font-weight:700;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.9);white-space:nowrap}
.bd{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:#ff3838;color:#fff;border:2px solid #fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.go{position:absolute;bottom:-6px;left:-8px;font-size:clamp(14px,4cqw,24px)}
.act{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:25;width:44%;min-width:200px;background:rgba(40,20,5,.92);color:#fff;border-radius:14px;padding:12px;text-align:center;font-weight:700}
.act .r{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.act button{padding:9px 14px;border:0;border-radius:10px;background:#ff9f43;color:#fff;font-weight:700}
.act button.g{background:#7f8c8d}
.fly{position:absolute;transform:translate(-50%,-50%);font-size:clamp(24px,6cqw,40px);transition:left 1s ease-in,top 1s ease-in,opacity 1s;pointer-events:none;z-index:40}
.chat-area{width:380px;height:100%;background:#f4f4f4;display:flex;flex-direction:column;border-left:2px solid #ccc}
.chat-head{padding:12px 15px;font-weight:700;border-bottom:1px solid #e0e0e0;background:#fff}
.chat-messages{flex:1;min-height:0;padding:12px 15px;overflow-y:auto;display:flex;flex-direction:column;gap:9px}
.fr{display:flex;align-items:center;gap:8px;font-size:13px}
.ic{width:26px;height:26px;background:#bdc3c7;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:15px}
.arrow{color:#e67e22;font-weight:700}
.msg{font-size:13px;line-height:1.3;user-select:text}
.msg b{color:#c0560e}
.sys{font-size:11px;background:#fff3cd;border:1px solid #ffeeba;color:#856404;padding:8px 10px;border-radius:4px}
.tray{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:#fff;border-top:1px solid #e0e0e0}
.tray button{flex:none;font-size:20px;width:38px;height:38px;border-radius:8px;border:1px solid #ddd;background:#fafafa}
.chat-footer{display:flex;gap:8px;align-items:center;padding:10px 12px;background:#fff;border-top:1px solid #e0e0e0}
.chat-footer input{flex:1;border:0;outline-offset:2px;font-size:14px;color:#555;user-select:text}
.send{width:34px;height:34px;border-radius:50%;border:0;background:#ff9f43;color:#fff;font-size:14px}
@media (max-width:820px){body{flex-direction:column}.game-area{flex:1.4}.chat-area{width:100%;height:auto;flex:1;border-left:0;border-top:2px solid #ccc}}
@media (prefers-reduced-motion:reduce){.fly{transition:none}}
</style>
</head>
<body>
<div class="game-area">
  <div class="topbar">
    <div class="pill heart" title="Ürəklər">❤️ <span id="hearts">0</span></div>
    <button class="pill" id="bMusic" aria-label="Musiqi">🎵</button>
    <button class="pill" id="bNew" aria-label="Yeni oyun">🔄</button>
    <div id="status"></div>
  </div>
  <div class="stage" id="stage">
    <div class="rosette"></div>
    <button id="bottle" aria-label="Butulkanı fırlat"><svg viewBox="0 0 40 150" aria-hidden="true"><path d="M16 2h8v8c0 6 2 9 6 14 4 6 6 10 6 18v96c0 6-4 10-10 10H14c-6 0-10-4-10-10V42c0-8 2-12 6-18 4-5 6-8 6-14z" fill="#27ae60" stroke="#1e8449" stroke-width="2"/><rect x="6" y="14" width="5" height="120" rx="2" fill="#fff" opacity=".25"/></svg></button>
    <div class="act hidden" id="act"><div id="actq"></div><div class="r"><button id="yes"></button><button class="g" id="no"></button></div></div>
  </div>
</div>
<div class="chat-area">
  <div class="chat-head">Masa 63</div>
  <div class="chat-messages" id="feed"></div>
  <div class="tray" id="tray"></div>
  <div class="chat-footer"><input id="inp" maxlength="120" placeholder="Mesaj yaz..." autocomplete="off"><button class="send" id="bSend" aria-label="Göndər">➤</button></div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var BASE=[{n:"Sən",e:"🧑",me:1},{n:"Aysel, 24",e:"👩"},{n:"Nigar, 22",e:"👩‍🦰"},{n:"Elvin, 27",e:"🧔"},{n:"Leyla, 25",e:"👱‍♀️"},{n:"Orxan, 29",e:"👨"}];
var GIFTS=["💋","🌹","💐","🐤","🍓","🐸","🍅","🐷","🥊"];
var SAY=["Salam! 😊","Haha yaxşı idi","Gəl bir də fırlat 😄","Hədiyyə üçün sağ ol!","Növbə kimdədir?"];
var S=[],turn=0,sel=-1,total=0,gen=0,waitSpin=null;
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function status(t){$("status").textContent=t}
function pos(i){var a=Math.PI+i*2*Math.PI/S.length;return {x:50+40*Math.sin(a),y:50-40*Math.cos(a)}}

/* səs */
var ac=null,sfxOn=true,musicOn=false,mT=null,step=0;
function ctx(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==="suspended")ac.resume();return ac}
function beep(f,d,t,v){var a=ctx();if(!a)return;var o=a.createOscillator(),g=a.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=v||.08;g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
var SC=[262,294,330,392,440,523,440,392];
$("bMusic").onclick=function(){musicOn=!musicOn;ctx();if(musicOn){mT=setInterval(function(){beep(SC[step%8]*(step%16<8?1:1.5),.35,"triangle",.035);step++},420)}else{clearInterval(mT)}this.textContent=musicOn?"🎶":"🎵"};

/* görünüş */
function render(){
  var st=$("stage");[].slice.call(st.querySelectorAll(".seat")).forEach(function(e){e.remove()});
  S.forEach(function(p,i){
    var q=pos(i),b=document.createElement("button");
    b.className="seat"+(i===turn?" turn":"")+(i===sel?" sel":"");b.style.left=q.x+"%";b.style.top=q.y+"%";b.setAttribute("aria-label",p.n);
    var av=document.createElement("span");av.className="av";av.textContent=p.e;
    if(p.h){var bd=document.createElement("span");bd.className="bd";bd.textContent=p.h;av.appendChild(bd)}
    if(p.g){var g=document.createElement("span");g.className="go";g.textContent=p.g;av.appendChild(g)}
    var nm=document.createElement("span");nm.className="nm";nm.textContent=p.n;
    b.appendChild(av);b.appendChild(nm);b.onclick=function(){sel=i;render()};st.appendChild(b)
  });
  $("hearts").textContent=S[0].h
}
function add(el){var f=$("feed");f.appendChild(el);f.scrollTop=f.scrollHeight}
function feed(icon,a,b){
  var r=document.createElement("div");r.className="fr";
  [[a.e,"ic"],[icon,"gi"],["»","arrow"],[b.e,"ic"]].forEach(function(x){var s=document.createElement("span");s.className=x[1];s.textContent=x[0];r.appendChild(s)});
  add(r)
}
function chat(name,text){var m=document.createElement("div");m.className="msg";var b=document.createElement("b");b.textContent=name+": ";m.appendChild(b);m.appendChild(document.createTextNode(text));add(m)}
function sysmsg(t){var d=document.createElement("div");d.className="sys";d.textContent=t;add(d)}
function fly(txt,fx,fy,tx,ty,big){
  var e=document.createElement("span");e.className="fly";e.textContent=txt;e.style.left=fx+"%";e.style.top=fy+"%";if(big)e.style.fontSize="clamp(50px,16cqw,110px)";
  $("stage").appendChild(e);
  requestAnimationFrame(function(){requestAnimationFrame(function(){e.style.left=tx+"%";e.style.top=ty+"%";if(big)e.style.opacity="0"})});
  setTimeout(function(){e.style.opacity="0"},big?100:900);setTimeout(function(){e.remove()},1100)
}

/* oyun axını */
function ask(i,q,yes,no){
  if(S[i].me){return new Promise(function(r){
    $("actq").textContent=q;$("yes").textContent=yes;$("no").textContent=no;$("act").classList.remove("hidden");
    $("yes").onclick=function(){$("act").classList.add("hidden");r(true)};
    $("no").onclick=function(){$("act").classList.add("hidden");r(false)}
  })}
  status(S[i].n+" düşünür...");
  return sleep(1500).then(function(){return Math.random()<.7})
}
async function spin(){
  total+=1440+Math.random()*360;
  var b=$("bottle");b.style.transition="transform 4s cubic-bezier(.15,.65,.2,1)";
  b.style.transform="translate(-50%,-50%) rotate("+total+"deg)";
  var t=0,gap=60;for(var k=0;k<24;k++){(function(tt){setTimeout(function(){beep(500+Math.random()*80,.05,"square",.03)},tt)})(t);gap*=1.12;t+=gap}
  await sleep(4100);
  var n=S.length,d=(((total-180)%360)+360)%360;
  return Math.round(d/(360/n))%n
}
async function round(g){
  while(g===gen){
    var sp=S[turn];render();
    if(sp.me){status("Sənin növbən: butulkaya toxun");await new Promise(function(r){waitSpin=r})}
    else{status(sp.n+" butulkanı fırladır");await sleep(1400)}
    if(g!==gen)return;
    var idx;do{idx=await spin();if(g!==gen)return;if(idx===turn){status("Butulka özünə düşdü, yenidən");await sleep(1000)}}while(idx===turn);
    sel=idx;render();var tg=S[idx];beep(660,.25,"sine",.1);
    status(sp.n+" → "+tg.n);await sleep(900);if(g!==gen)return;
    var a=await ask(turn,tg.n+" sənə düşdü. Öpmək istəyirsən?","💋 Öp","Öpmə");if(g!==gen)return;
    if(!a){feed("🙈",sp,tg);status(sp.n+" öpmədi 🙈")}
    else{
      var b=await ask(idx,sp.n+" səni öpmək istəyir. Qəbul edirsən?","Qəbul et 💋","Rədd et");if(g!==gen)return;
      if(b){sp.h+=3;tg.h+=3;fly("💋",50,50,50,30,1);beep(988,.2,"sine",.12);setTimeout(function(){beep(1319,.3,"sine",.12)},160);feed("💋",sp,tg);status(sp.n+" və "+tg.n+" öpüşdü 💋")}
      else{feed("🙈",sp,tg);status(tg.n+" rədd etdi 🙈")}
    }
    render();await sleep(2200);
    turn=(turn+1)%S.length;sel=-1
  }
}
$("bottle").onclick=function(){if(waitSpin){var r=waitSpin;waitSpin=null;ctx();r()}};
function start(){
  gen++;waitSpin=null;turn=0;sel=-1;total=0;
  S=BASE.map(function(p){return {n:p.n,e:p.e,me:p.me,h:0,g:""}});
  var b=$("bottle");b.style.transition="none";b.style.transform="translate(-50%,-50%) rotate(0deg)";
  $("act").classList.add("hidden");$("feed").innerHTML="";
  sysmsg("Masa 63-ə xoş gəldin! Bu demo versiyadır: digər oyunçular botdur. Real oyunçular növbəti mərhələdə əlavə olunacaq.");
  render();round(gen)
}
$("bNew").onclick=start;

/* hədiyyələr və çat */
GIFTS.forEach(function(g){
  var b=document.createElement("button");b.textContent=g;b.setAttribute("aria-label","Hədiyyə "+g);
  b.onclick=function(){
    if(sel<1){status("Hədiyyə üçün əvvəlcə oyunçuya toxun");return}
    var to=sel,q=pos(to);S[to].g=g;feed(g,S[0],S[to]);fly(g,50,90,q.x,q.y);beep(784,.12,"sine",.1);setTimeout(function(){beep(1047,.2,"sine",.1)},110);
    setTimeout(render,1000)
  };
  $("tray").appendChild(b)
});
function send(){
  var v=$("inp").value.trim();if(!v)return;$("inp").value="";chat("Sən",v);
  if(Math.random()<.6){var bot=S[1+Math.floor(Math.random()*(S.length-1))],g=gen;setTimeout(function(){if(g===gen)chat(bot.n.split(",")[0],SAY[Math.floor(Math.random()*SAY.length)])},1500)}
}
$("bSend").onclick=send;
$("inp").onkeydown=function(e){if(e.key==="Enter")send()};
setInterval(function(){
  if(S.length<3)return;
  var a=1+Math.floor(Math.random()*(S.length-1)),b=Math.floor(Math.random()*S.length);if(a===b)return;
  var g=GIFTS[Math.floor(Math.random()*GIFTS.length)];S[b].g=g;feed(g,S[a],S[b]);render()
},7000);
start();
})();
</script>
</body>
</html>
